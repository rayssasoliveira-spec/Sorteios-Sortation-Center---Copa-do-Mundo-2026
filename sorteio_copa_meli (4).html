<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteio Copa 2026 – Mercado Livre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    padding: 2.5rem 2rem;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 8px 48px rgba(0,0,0,0.4);
  }
  .header { text-align: center; margin-bottom: 1.8rem; }
  .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .meli-badge { background: #FFE600; color: #1a1a2e; font-size: 13px; font-weight: 700; padding: 4px 14px; border-radius: 20px; }
  .copa-badge { background: #009B3A; color: #fff; font-size: 13px; font-weight: 700; padding: 4px 14px; border-radius: 20px; }
  h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #888; }
  .op-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .op-btn { border: 2px solid #ddd; background: #f8f8f8; color: #555; padding: 10px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .op-btn:hover { background: #f0f0f0; }
  .op-btn.active { background: #FFE600; border-color: #c9b800; color: #1a1a2e; }
  .range-badge { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 1.8rem; }
  .range-badge strong { background: #f5f5f5; padding: 3px 12px; border-radius: 20px; color: #555; }
  .prize-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
  .prize-row { display: flex; align-items: center; gap: 14px; background: #fafafa; border: 2px solid #eee; border-radius: 14px; padding: 14px 18px; transition: border-color 0.3s, background 0.3s; }
  .prize-row.drawn { border-color: #FFE600; background: #fffde7; }
  .medal { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .prize-info { flex: 1; }
  .prize-label { font-size: 11px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 1px; }
  .prize-place { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .number-display { font-size: 32px; font-weight: 700; color: #ddd; min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; transition: color 0.3s; }
  .number-display.spinning { color: #FFE600; }
  .number-display.drawn { color: #009B3A; }
  .draw-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; background: #FFE600; color: #1a1a2e; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .draw-btn:hover { background: #FFC400; transform: translateY(-1px); }
  .draw-btn:active { transform: scale(0.99); }
  .draw-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .reset-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid #ddd; background: transparent; color: #aaa; font-size: 14px; cursor: pointer; margin-top: 10px; font-family: inherit; transition: all 0.15s; }
  .reset-btn:hover { background: #f5f5f5; color: #777; }
  .congrats { text-align: center; padding: 11px 16px; border-radius: 12px; background: #e8f5e9; border: 2px solid #a5d6a7; margin-bottom: 1rem; font-size: 15px; color: #2e7d32; font-weight: 600; display: none; }
  .congrats.show { display: block; animation: popIn 0.3s ease; }
  @keyframes popIn { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
  .done-msg { text-align: center; font-size: 13px; color: #bbb; margin-top: 8px; min-height: 20px; }

  .history-section { margin-top: 2rem; border-top: 2px solid #f0f0f0; padding-top: 1.5rem; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .history-title { font-size: 15px; font-weight: 700; color: #555; }
  .clear-history-btn { font-size: 12px; color: #bbb; background: none; border: 1px solid #eee; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-family: inherit; }
  .clear-history-btn:hover { color: #e24b4a; border-color: #e24b4a; }
  .history-empty { font-size: 13px; color: #ccc; text-align: center; padding: 1rem 0; }
  .history-entry { background: #fafafa; border: 1.5px solid #eee; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
  .history-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .history-op { font-size: 13px; font-weight: 700; color: #1a1a2e; background: #FFE600; padding: 2px 10px; border-radius: 20px; }
  .history-time { font-size: 11px; color: #bbb; }
  .history-numbers { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-num { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .history-num .pos { font-size: 11px; font-weight: 400; color: #888; margin-right: 3px; }

  #celebration { position: fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:999; display:none; }
  .confetti-piece { position:absolute; top:-20px; border-radius:2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity:0; } }
</style>
</head>
<body>
<div id="celebration"></div>
<div class="container">
  <div class="header">
    <div class="logo-area">
      <span class="meli-badge">&#9889; Mercado Livre</span>
      <span class="copa-badge">&#9917; Copa 2026</span>
    </div>
    <h1>Sorteio de Prêmios</h1>
    <p class="subtitle">Selecione a operação e realize o sorteio</p>
  </div>

  <div class="op-selector">
    <button class="op-btn active" onclick="selectOp(this,'XSP09',948)">XSP09</button>
    <button class="op-btn" onclick="selectOp(this,'XSP17',106)">XSP17</button>
    <button class="op-btn" onclick="selectOp(this,'XSP23',300)">XSP23</button>
  </div>

  <div class="range-badge">Números de <strong id="rangeLabel">1 a 948</strong></div>
  <div class="prize-list" id="prizeList"></div>
  <div class="congrats" id="congrats"></div>
  <button class="draw-btn" id="drawBtn" onclick="drawNext()">&#127919; <span id="drawLabel">Sortear 1° Lugar</span></button>
  <button class="reset-btn" onclick="resetAll()">&#8635; Reiniciar sorteio</button>
  <div class="done-msg" id="doneMsg"></div>

  <div class="history-section">
    <div class="history-header">
      <div class="history-title">&#128203; Histórico de sorteios</div>
      <button class="clear-history-btn" onclick="clearHistory()">Limpar histórico</button>
    </div>
    <div id="historyList"><div class="history-empty">Nenhum sorteio realizado ainda.</div></div>
  </div>
</div>

<script>
  var TOTAL = 3;
  var medals = ['1°','2°','3°','4°','5°','6°'];
  var medalIcons = ['&#127941;','&#129352;','&#129353;','4°','5°','6°'];
  var labels = ['1° Lugar','2° Lugar','3° Lugar','4° Lugar','5° Lugar','6° Lugar'];
  var currentOp = 'XSP09';
  var range = 948;
  var step = 0;
  var drawn = [];
  var anim = null;
  var history = [];

  function buildRows() {
    var list = document.getElementById('prizeList');
    list.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) {
      var row = document.createElement('div');
      row.className = 'prize-row';
      row.id = 'row' + i;
      row.innerHTML =
        '<div class="medal">' + medalIcons[i] + '</div>' +
        '<div class="prize-info">' +
          '<div class="prize-label">Classificação</div>' +
          '<div class="prize-place">' + labels[i] + '</div>' +
        '</div>' +
        '<div class="number-display" id="num' + i + '">—</div>';
      list.appendChild(row);
    }
  }

  function selectOp(btn, op, r) {
    document.querySelectorAll('.op-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentOp = op;
    range = r;
    document.getElementById('rangeLabel').textContent = '1 a ' + r;
    resetAll();
  }

  function randUnique() {
    var n, attempts = 0;
    do {
      n = Math.floor(Math.random() * range) + 1;
      attempts++;
    } while (drawn.indexOf(n) >= 0 && attempts < 10000);
    return n;
  }

  function drawNext() {
    if (step >= TOTAL) return;
    var btn = document.getElementById('drawBtn');
    btn.disabled = true;
    var currentStep = step;
    var numEl = document.getElementById('num' + currentStep);
    numEl.classList.remove('drawn');
    numEl.classList.add('spinning');
    var ticks = 0;
    var total = 30;

    anim = setInterval(function() {
      numEl.textContent = Math.floor(Math.random() * range) + 1;
      ticks++;
      if (ticks >= total) {
        clearInterval(anim);
        var final = randUnique();
        drawn.push(final);
        numEl.textContent = final;
        numEl.classList.remove('spinning');
        numEl.classList.add('drawn');
        document.getElementById('row' + currentStep).classList.add('drawn');

        // atualiza congrats
        var el = document.getElementById('congrats');
        el.innerHTML = medalIcons[currentStep] + ' <strong>' + labels[currentStep] + '</strong>: número <strong>' + final + '</strong>! Parabéns!';
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');

        // salva no histórico a cada sorteio
        updateHistory(currentStep, final);

        step++;

        if (step >= TOTAL) {
          celebrate();
          document.getElementById('drawLabel').textContent = '&#127881; Sorteio concluído!';
          document.getElementById('doneMsg').textContent = 'Todos os lugares foram sorteados. Reinicie para um novo sorteio.';
        } else {
          btn.disabled = false;
          document.getElementById('drawLabel').textContent = 'Sortear ' + labels[step];
        }
      }
    }, 55);
  }

  function updateHistory(pos, num) {
    // Se ainda não tem entrada para este sorteio atual, cria
    if (history.length === 0 || history[0].complete) {
      var now = new Date();
      var time = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      history.unshift({ op: currentOp, time: time, numbers: [], complete: false });
    }
    history[0].numbers.push({ pos: pos, num: num });
    if (history[0].numbers.length >= TOTAL) {
      history[0].complete = true;
    }
    renderHistory();
  }

  function renderHistory() {
    var el = document.getElementById('historyList');
    if (history.length === 0) {
      el.innerHTML = '<div class="history-empty">Nenhum sorteio realizado ainda.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < history.length; i++) {
      var h = history[i];
      var status = h.complete ? '' : ' <span style="font-size:11px;color:#aaa;">(em andamento)</span>';
      var nums = h.numbers.map(function(item) {
        return '<span class="history-num"><span class="pos">' + labels[item.pos] + ':</span> ' + item.num + '</span>';
      }).join('');
      html +=
        '<div class="history-entry">' +
          '<div class="history-entry-header">' +
            '<span class="history-op">&#9917; ' + h.op + '</span>' +
            '<span class="history-time">' + h.time + status + '</span>' +
          '</div>' +
          '<div class="history-numbers">' + nums + '</div>' +
        '</div>';
    }
    el.innerHTML = html;
  }

  function clearHistory() {
    history = [];
    renderHistory();
  }

  function celebrate() {
    var el = document.getElementById('celebration');
    el.style.display = 'block';
    el.innerHTML = '';
    var colors = ['#FFE600','#009B3A','#003087','#FF6B00','#ffffff','#FFC400'];
    for (var i = 0; i < 90; i++) {
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = (8 + Math.random() * 8) + 'px';
      p.style.height = (8 + Math.random() * 8) + 'px';
      p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * 0.8) + 's';
      el.appendChild(p);
    }
    setTimeout(function(){ el.style.display = 'none'; }, 4500);
  }

  function resetAll() {
    step = 0;
    drawn = [];
    clearInterval(anim);
    buildRows();
    document.getElementById('drawLabel').textContent = 'Sortear 1° Lugar';
    document.getElementById('drawBtn').disabled = false;
    document.getElementById('congrats').classList.remove('show');
    document.getElementById('doneMsg').textContent = '';
  }

  buildRows();
  renderHistory();
</script>
</body>
</html>
